<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a14"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><title>KLYRO — Your music, your mood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a14;--s1:#1b1724;--s2:#262033;--tx:#fff;--mu:#9b94ad;--lime:#c8f169;--ln:#2d2740;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:500 15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;padding-bottom:200px}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:340px;z-index:-1;background:radial-gradient(55% 90% at 0% 0%,rgba(190,110,255,.5),transparent 70%),radial-gradient(40% 70% at 28% 0%,rgba(255,110,170,.3),transparent 70%)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.app{max-width:520px;margin:0 auto;padding:0 20px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:22px 0 8px}
.hd .r{display:flex;gap:10px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff4fa3,#8b5cf6)}
.cb{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;backdrop-filter:blur(8px)}
.hi{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:10px 0 16px}
.chips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chip{padding:10px 18px;border-radius:99px;background:var(--s2);color:#ddd8ea;font-weight:600;white-space:nowrap}
.chip.on{background:var(--lime);color:#141018;font-weight:800}
h2{font-size:19px;font-weight:700;margin:26px 0 14px}
.sec{display:flex;justify-content:space-between;align-items:center}.sec button{color:var(--mu);font-size:13px}
.hrow{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 4px}
.fc{flex:none;width:292px;min-height:158px;border-radius:24px;padding:16px;display:flex;gap:10px;color:#1a1424;text-align:left}
.ft{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.ft small{font-weight:700;opacity:.7}.ft b{font-size:19px;line-height:1.15;font-weight:800}
.ft span{font-size:12px;opacity:.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ft .pb{margin-top:auto}
.fi{width:116px;align-self:stretch;border-radius:18px;background-size:cover;background-position:center;display:grid;place-items:center;font-weight:800;font-size:26px;color:rgba(255,255,255,.9)}
.pb{width:40px;height:40px;border-radius:50%;background:var(--s2);display:grid;place-items:center;flex:none;color:#fff}
.pb.dk{background:#2a1b4a;color:#fff}
.pb.on svg{fill:var(--lime);stroke:var(--lime)}
.rw{display:flex;align-items:center;gap:14px;padding:8px 0;cursor:pointer;border-radius:14px}
.rw.on b{color:var(--lime)}
.rw .pb{width:36px;height:36px}
.th{width:54px;height:54px;border-radius:14px;flex:none;background-size:cover;background-position:center;display:grid;place-items:center;font-weight:800;color:rgba(255,255,255,.9)}
.th.sm{width:40px;height:40px;border-radius:12px;background:var(--s2);color:var(--mu);font-size:13px}
.rt{flex:1;min-width:0}.rt b,.rt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{color:var(--mu);font-size:12px;font-weight:500}
.top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:22px 0 14px;text-align:center;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.card{text-align:left;display:block;width:100%}.card b{display:block;margin-top:8px}.card small{color:var(--mu)}
.cov{aspect-ratio:1;border-radius:22px;background-size:cover;background-position:center;display:grid;place-items:center;font-weight:800;font-size:32px;color:rgba(255,255,255,.9)}
.empty{border:1px dashed var(--ln);border-radius:20px;padding:26px;text-align:center;color:var(--mu)}
input[type=text],input[type=url],textarea{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:13px 16px;width:100%}
form{display:grid;gap:14px}label{display:grid;gap:6px;font-weight:700;font-size:13px}label em{color:var(--mu);font-style:normal;font-weight:500}
input[type=file]{color:var(--mu);font-size:13px}
.box{background:var(--s1);border-radius:20px;padding:14px;display:grid;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:99px;font-weight:800;background:var(--lime);color:#141018}
.btn.g{background:var(--s2);color:#fff}
.note{font-size:12px;color:var(--mu)}
.ah{text-align:center}.ah .cov{width:210px;margin:6px auto 18px;border-radius:28px}
.ah h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.ar{display:flex;justify-content:center;align-items:center;gap:8px;margin:8px 0;color:var(--mu)}.ar .av{width:26px;height:26px;font-size:11px;background-size:cover}
.soc{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}.soc a{padding:7px 14px;border-radius:99px;background:var(--s2);color:#fff;text-decoration:none;font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 8px}
#mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));width:min(100% - 24px,496px);z-index:6;display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:20px;background:rgba(38,32,51,.94);backdrop-filter:blur(16px);cursor:pointer}
#mini[hidden]{display:none}
#mini .th{width:44px;height:44px;border-radius:12px}
#nv{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(100% - 28px,420px);z-index:7;display:flex;justify-content:space-between;padding:8px;border-radius:32px;background:rgba(44,38,58,.88);backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(0,0,0,.5)}
#nv button{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#cfc9de;transition:background .2s}
#nv button.on{background:var(--lime);color:#141018}
.np{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 18px) 24px calc(env(safe-area-inset-bottom,0px) + 28px);transition:transform .35s,visibility .35s}
.np:not(.o){transform:translateY(100%);visibility:hidden}
#npbg{position:absolute;inset:-60px;background-size:cover;filter:blur(55px) saturate(1.3);opacity:.5;z-index:0}
.np>*:not(#npbg){position:relative;z-index:1;width:100%;max-width:440px}
.nh{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center;font-weight:700}
#npc{width:min(70vw,290px);aspect-ratio:1;border-radius:50%;margin:5vh auto 3vh;background-size:cover;background-position:center;display:grid;place-items:center;font-size:56px;font-weight:800;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.np h1{font-size:22px;text-align:center;font-weight:800}
#na{text-align:center;color:var(--mu);font-size:13px;margin-top:4px}
#nq{text-align:center;margin:3vh 0 auto;line-height:1.7}#nq p{color:rgba(255,255,255,.4)}#nq p:nth-child(2){color:#fff}
.sk{display:grid;gap:4px;margin-top:16px}.sk div{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
input[type=range]{width:100%;accent-color:var(--lime)}
.ct{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.ct button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#ddd}
.ct button.on{color:var(--lime)}
.ct .big{width:72px;height:72px;background:var(--lime);color:#141018}.ct .big .i{width:28px;height:28px}
#toast{position:fixed;left:50%;bottom:210px;transform:translateX(-50%);background:var(--lime);color:#141018;font-weight:800;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
#toast.s{opacity:1}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center}
#login::before{content:"";position:absolute;inset:0 0 auto 0;height:50%;background:radial-gradient(60% 80% at 20% 0%,rgba(190,110,255,.55),transparent 70%),radial-gradient(40% 60% at 80% 0%,rgba(255,110,170,.3),transparent 70%)}
#login>*{position:relative}
#login[hidden]{display:none}
.lg{font-size:48px;font-weight:800;letter-spacing:.06em;background:linear-gradient(90deg,#c9a7ff,#ff4fa3);-webkit-background-clip:text;background-clip:text;color:transparent}
#login p{color:var(--mu);max-width:300px}
.gb{display:flex;align-items:center;gap:12px;background:#fff;color:#1f1f1f;font-weight:700;padding:14px 26px;border-radius:99px;margin-top:18px}
.gb svg{width:22px;height:22px}
.lgo{border-radius:50%;object-fit:cover;display:block}
.dr{position:fixed;inset:0;z-index:40;visibility:hidden;transition:visibility .3s}
.dr.o{visibility:visible}
.drb{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .3s}
.dr.o .drb{opacity:1}
.drp{position:absolute;left:0;top:0;bottom:0;width:min(86%,340px);background:#1b1824;padding:calc(env(safe-area-inset-top,0px) + 18px) 14px 24px;transform:translateX(-100%);transition:transform .3s;overflow-y:auto}
.dr.o .drp{transform:none}
.dh{display:flex;align-items:center;gap:14px;padding:14px;background:var(--s2);border-radius:18px;margin-bottom:12px;width:100%;text-align:left}
.dh .av{width:58px;height:58px;flex:none}.dh b{font-size:18px;display:block}.dh small{color:var(--mu)}
.di{display:flex;align-items:center;gap:16px;padding:16px 10px;width:100%;font-size:16px;font-weight:600;border-radius:14px;text-align:left}
.di:hover{background:var(--s2)}
.br{display:flex;align-items:center;gap:10px}.wm{font-weight:800;letter-spacing:.08em;font-size:18px}
.av{border:0;background-size:cover;background-position:center}
@media(min-width:700px){.app{padding-top:10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app" id="app"></main>
<div id="mini" hidden data-act="np" role="button" tabindex="0" aria-label="Open player"><div class="th" id="mc"></div><div class="rt"><b id="mt"></b><small id="ma"></small></div><button class="pb" id="mpp" data-act="tog" aria-label="Play or pause"></button><button class="pb" data-act="nx" aria-label="Next" id="mnx"></button></div>
<div id="nv" role="navigation" aria-label="Main"></div>
<section class="np" id="np" aria-label="Now playing"><div id="npbg"></div>
 <div class="nh"><button class="cb" data-act="npx" aria-label="Close" id="nx0"></button><span>Now Playing</span><button class="cb" id="nh" data-act="like|cur" aria-label="Like"></button></div>
 <div id="npc"></div><h1 id="nt"></h1><div id="na"></div><div id="nq"></div>
 <div class="sk"><input type="range" id="sk" min="0" max="100" value="0" aria-label="Seek"><div><span id="cur">0:00</span><span id="rem">-0:00</span></div></div>
 <div class="ct"><button data-act="sh" id="nsh" aria-label="Shuffle"></button><button data-act="pv" id="npv" aria-label="Previous"></button><button class="big" id="npp" data-act="tog" aria-label="Play or pause"></button><button data-act="nx" id="nnx" aria-label="Next"></button><button data-act="rp" id="nrp" aria-label="Repeat"></button></div>
</section>
<div id="login"><img class="lgo" id="lgi" alt="" style="width:120px;height:120px;box-shadow:0 10px 40px rgba(180,30,50,.45)"><div class="lg">KLYRO</div><p>Your music, your mood. Stream your favorite songs, discover new artists, and vibe to every beat.</p>
<button class="gb" id="gbtn"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.6A14.5 14.5 0 019.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.2A24 24 0 000 24c0 3.9.9 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</button><button id="skipb" style="margin-top:4px;color:var(--mu);text-decoration:underline">Just listen for now</button></div>
<input type="file" id="addf" accept="audio/*" multiple hidden>
<div class="dr" id="dr"><div class="drb" data-act="drx"></div><aside class="drp" id="drp" aria-label="Account menu"></aside></div>
<div id="toast"></div>

const idbPut=async(k,v)=>{const d=await idb;if(!d)throw 0;return new Promise((ok,no)=>{const t=d.transaction('a','readwrite');t.objectStore('a').put(v,k);t.oncomplete=ok;t.onerror=no})};
const idbGet=async k=>{const d=await idb;if(!d)return null;return new Promise(ok=>{const q=d.transaction('a').objectStore('a').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})};

function wav(seed){const sr=8000,n=sr*18,b=new Uint8Array(44+n),v=new DataView(b.buffer),w=(o,s)=>[...s].forEach((c,i)=>b[o+i]=c.charCodeAt(0));
w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
const sc=[0,3,5,7,10,12,15,17],base=110*Math.pow(2,(seed%6)/12),step=Math.floor(sr*60/(88+seed*7)/2);
for(let i=0;i<n;i++){const s=Math.floor(i/step),p=(i%step)/step,t=i/sr,e=Math.pow(1-p,1.6),f=base*2*Math.pow(2,sc[(s*3+seed)%8]/12);
let x=Math.sin(6.283*f*t)*e*.45+Math.sin(6.283*base*t)*.22;
if(s%2==0)x+=Math.sin(6.283*(55*Math.exp(-p*5))*p*2)*e*.6;else x+=(Math.random()-.5)*e*e*.18;
b[44+i]=Math.max(0,Math.min(255,128+x*110))}
return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
const urlCache={};
async function srcOf(t){if(t.url)return t.url;if(urlCache[t.id])return urlCache[t.id];let u;if(t.seed)u=wav(t.seed);else{const bl=await idbGet(t.id);if(!bl)return null;u=URL.createObjectURL(bl)}return urlCache[t.id]=u}

async function img(file,max){if(!file)return'';return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82))};i.onerror=()=>ok('');i.src=r.result};r.onerror=()=>ok('');r.readAsDataURL(file)})}

  const a={id,uid:me?me.uid:'',title:$('#at').value.trim(),artist:$('#an').value.trim(),bio:$('#ab').value.trim(),g:Math.floor(Math.random()*6),cover:await img($('#ac').files[0],420),photo:await img($('#ap').files[0],120),soc:{instagram:$('#s1').value.trim(),youtube:$('#s2').value.trim(),spotify:$('#s3').value.trim(),tiktok:$('#s4').value.trim()},tracks};

const CLD={cloud:'hjs27iwz',preset:'klryo_uploads'};
function cup(file,onp){return new Promise((ok,no)=>{const x=new XMLHttpRequest(),f=new FormData();f.append('file',file);f.append('upload_preset',CLD.preset);x.open('POST',`https://api.cloudinary.com/v1_1/${CLD.cloud}/auto/upload`);x.upload.onprogress=e=>{if(e.lengthComputable&&onp)onp(e.loaded/e.total)};x.onload=()=>{try{const r=JSON.parse(x.responseText);r.secure_url?ok(r.secure_url):no(new Error((r.error&&r.error.message||'upload failed')+' ['+CLD.cloud+' / '+CLD.preset+']'))}catch(er){no(er)}};x.onerror=()=>no(new Error('network error'));x.send(f)})}
async function upl(files,btn){const out=[];for(let i=0;i<files.length;i++){const url=await cup(files[i],p=>{if(btn)btn.textContent='Uploading '+(i+1)+'/'+files.length+' · '+Math.round(p*100)+'%'});out.push({id:'t'+Date.now()+Math.random().toString(36).slice(2,7),title:files[i].name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '),url})}return out}
